<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#133f35"><title>OS Fácil</title><meta name="description" content="Seu trabalho conta. Registre suas OS e acompanhe seus resultados."><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#18372f;font:15px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;padding:25px 22px 18px;max-width:600px;margin:auto}.brand{font-size:23px;font-weight:800;letter-spacing:-1px}.brand span{color:#6b8c37}small,.muted{color:#738178}main{max-width:600px;margin:auto;padding:0 20px 100px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}.hero{background:#163f35;color:white;border-radius:25px;padding:25px;margin:10px 0 23px;position:relative;overflow:hidden}.hero:after{content:'↗';position:absolute;right:22px;top:28px;color:#bde586;font-size:55px}.hero small{color:#c5d6cb}.money{font-size:39px;font-weight:650;letter-spacing:-1.5px;margin:12px 0}.hero footer{border-top:1px solid #ffffff25;margin-top:20px;padding-top:16px;display:flex;justify-content:space-between}.chip{border:1px solid #dbe2d8;border-radius:12px;background:white;padding:9px 12px;color:#18372f}.date{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0}input[type=date],input[type=month]{border:1px solid #dbe2d8;border-radius:10px;padding:9px;background:white;color:#18372f;min-width:0}.tabs{display:flex;background:#e7ece3;padding:5px;border-radius:14px;gap:4px;margin-bottom:22px}.tabs button{flex:1;border:0;padding:12px;border-radius:10px;background:transparent;color:#61736a}.tabs .active{background:white;color:#173f35;box-shadow:0 2px 7px #173f3510;font-weight:650}h2{font-size:19px;letter-spacing:-.5px;margin:0 0 5px}p{line-height:1.5}.section-head{margin-bottom:17px}.card{background:white;border:1px solid #e2e8df;border-radius:19px;padding:17px;margin:11px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.code{font-size:11px;color:#72896b;letter-spacing:1px;font-weight:700}.name{font-size:17px;font-weight:650;margin:5px 0}.price{font-size:13px;color:#768277}.controls{display:flex;align-items:center;gap:14px;margin-top:17px;padding-top:14px;border-top:1px solid #eef1ec}.controls button{width:42px;height:42px;border:0;border-radius:13px;background:#ecf0e8;color:#254a3b;font-size:25px}.controls button.plus{background:#d9edb5;color:#254a3b}.controls button:disabled{opacity:.4;cursor:default}.count{font-size:20px;font-weight:700;min-width:20px;text-align:center}.subtotal{margin-left:auto;font-size:17px;font-weight:650}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid #e1e7de;display:flex;justify-content:center;gap:7px;padding:12px 12px max(12px,env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#7d887f;padding:10px 20px;border-radius:13px}.nav .active{background:#edf3e6;color:#244b37;font-weight:700}.full{width:100%;border:0;background:#173f35;color:white;padding:15px;border-radius:14px;margin-top:15px}.empty{text-align:center;padding:35px 12px;color:#77877c}.rategrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.rategrid input{width:100%;border:1px solid #d5dfd0;border-radius:10px;padding:12px;margin-top:6px}label{font-size:13px;color:#687c6d}.toast{position:fixed;bottom:90px;left:20px;right:20px;background:#173f35;color:white;max-width:550px;margin:auto;padding:15px;border-radius:14px;z-index:5}button:focus-visible,input:focus-visible{outline:3px solid #94bb5a;outline-offset:3px}.note{font-size:12px;color:#798579;margin-top:18px}.historyline{padding:10px 0;border-top:1px solid #eef1ec;font-size:13px}.historydate{border:0;background:none;color:#173f35;font-weight:700;padding:6px 0}
</style><link rel="stylesheet" href="/polish.css">
<header><div class="brand"><img src="/logo.svg" alt="" width="42" height="42"> <span class="wordmark">OS<span> Fácil</span></span></div><button class="profile-button" id="profile-button" aria-label="Editar meu nome"><span id="profile-initial">●</span></button></header><section class="welcome"><div><span class="eyebrow">Seu trabalho conta</span><div id="greeting">Olá!</div></div><button id="install-button" class="install-button">Instalar app ↗</button></section><main id="app"></main><nav class="nav" aria-label="Navegação"><button data-page="today">◷ &nbsp; Dia</button><button data-page="history">▤ &nbsp; Histórico</button><button data-page="rates">⚙ &nbsp; Tarifas</button></nav><div id="toast" class="toast" role="status" hidden></div>
<div class="splash" id="splash" role="status" aria-label="Carregando OS Fácil"><img src="/logo.svg" alt="" width="88" height="88"><strong>OS Fácil</strong><span id="loading-label">Preparando seu dia…</span><div class="loading-track"><div id="loading-progress"></div></div><button id="loading-retry" hidden onclick="location.reload()">Tentar novamente</button></div>
<dialog id="name-dialog"><form id="name-form"><img src="/logo.svg" alt="" width="58" height="58"><span class="eyebrow">Bem-vindo ao OS Fácil</span><h2>Como podemos te chamar?</h2><p>Vamos deixar seu dia de trabalho com a sua cara.</p><label for="user-name">Seu nome</label><input id="user-name" name="name" placeholder="Digite seu nome" autocomplete="given-name" maxlength="40" required><button class="full" type="submit">Começar meu dia ↗</button><p class="note">Seu nome e seus registros ficam salvos neste aparelho.</p></form></dialog>
<dialog id="install-dialog"><div class="dialog-heading"><img src="/logo.svg" alt="" width="52" height="52"><button id="close-install" aria-label="Fechar instruções">×</button></div><h2>OS Fácil no seu celular</h2><div id="install-help"></div><button class="full" id="install-confirm">Entendi</button></dialog><script>window.osBootStarted=performance.now();setTimeout(()=>{const s=document.getElementById("splash");if(s&&!s.classList.contains("finished")){document.getElementById("loading-label").textContent="O carregamento demorou mais que o esperado.";document.getElementById("loading-retry").hidden=false}},6000)</script><script src="/app.js"></script><script src="/experience.js"></script></html>
